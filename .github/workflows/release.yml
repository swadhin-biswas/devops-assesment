name: Release

# GitHub Actions owns releases. This workflow starts when the "PR checks"
# workflow completes on main. Buildkite's GitHub Actions pipeline trigger does
# not support workflow_run, so it cannot import this workflow; Buildkite stays
# a pull-request mirror. A prepare job skips commits that do not touch build
# inputs, so docs-only merges do not release. A preflight makes the release
# idempotent: when v<VERSION> already points at the same commit, the signed
# image is reused and only the deploy runs, so duplicate triggers and manual
# retries cannot fail on an already-published tag. The workflow also creates
# the GitHub Release, so no post-run manual step is required.
on:
  workflow_run:
    workflows:
      - PR checks
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  REGISTRY_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/devops-task
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  prepare:
    name: prepare-release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.changes.outputs.needed }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Check for build inputs
        id: changes
        run: |
          set -euo pipefail
          # A manual dispatch is an explicit release request: always build.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            needed=true
          elif base=$(git rev-parse HEAD^ 2>/dev/null); then
            if git diff --quiet "$base" HEAD -- app Dockerfile .dockerignore pyproject.toml uv.lock VERSION scripts/deploy.sh .github/workflows/release.yml; then
              needed=false
            else
              needed=true
            fi
          else
            needed=true
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "release needed: $needed"

  build-and-deploy:
    name: build-and-deploy
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          version=$(cat VERSION)
          test -n "$version"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "release tag: v${version}"

      # Idempotent preflight. The registry is the source of truth:
      #   - v<VERSION> missing            -> build, sign and attest
      #   - v<VERSION> == commit-SHA tag  -> reuse the signed image, deploy only
      #   - v<VERSION> points elsewhere   -> refuse, so a version is immutable
      # This makes duplicate workflow_run events, re-runs, and manual
      # dispatches safe instead of failing on an already-pushed tag.
      - name: Preflight the release tag
        id: preflight
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          repo="${REGISTRY_IMAGE#docker.io/}"
          token=$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" | jq -r .token)
          manifest_digest() {
            local tag=$1 headers code
            headers=$(mktemp)
            code=$(curl -sI -o "$headers" -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://registry-1.docker.io/v2/${repo}/manifests/${tag}")
            case "$code" in
              200)
                tr -d '\r' < "$headers" | awk 'tolower($1)=="docker-content-digest:"{print $2}'
                ;;
              404)
                ;;
              *)
                echo "registry returned HTTP ${code} for ${tag}" >&2
                rm -f "$headers"
                return 1
                ;;
            esac
            rm -f "$headers"
          }
          version_tag="v${VERSION}"
          version_digest=$(manifest_digest "$version_tag")
          sha_digest=$(manifest_digest "$RELEASE_SHA")
          if [ -z "$version_digest" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "${version_tag} is new; building, signing and attesting it"
          elif [ -n "$sha_digest" ] && [ "$version_digest" = "$sha_digest" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "digest=${version_digest}" >> "$GITHUB_OUTPUT"
            echo "${version_tag} already points at ${RELEASE_SHA} (${version_digest}); reusing the signed image and deploying"
          else
            echo "${version_tag} already exists with digest ${version_digest}, but ${RELEASE_SHA} is ${sha_digest:-not built}; bump VERSION before releasing" >&2
            exit 1
          fi

      - name: Set build metadata
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        if: vars.EC2_INSTANCE_ID != '' || vars.EC2_INSTANCE_ID_STAGING != '' || vars.EC2_INSTANCE_ID_PROD != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-release-${{ github.run_id }}

      - name: Log in to Docker Hub
        if: steps.preflight.outputs.build == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_KEY }}

      - name: Set up QEMU
        if: steps.preflight.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        if: steps.preflight.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        if: steps.preflight.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:v${{ steps.version.outputs.value }}
            ${{ env.REGISTRY_IMAGE }}:${{ env.RELEASE_SHA }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ env.RELEASE_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Keyless signing: cosign uses the workflow's GitHub OIDC identity, so
      # no signing key is stored anywhere. The signature and SBOM attestation
      # are attached to the image digest in the registry.
      - name: Install cosign
        if: steps.preflight.outputs.build == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless)
        if: steps.preflight.outputs.build == 'true'
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Install syft
        if: steps.preflight.outputs.build == 'true'
        env:
          SYFT_VERSION: 1.54.0
          SYFT_SHA256: 54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860
        run: |
          mkdir -p .ci-bin
          curl -fsSL -o /tmp/syft.tar.gz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C .ci-bin syft
          ./.ci-bin/syft version

      # Artifact storage is unavailable on this account, so the SBOM stays in
      # the workspace for the attest step instead of being uploaded.
      - name: Generate SPDX SBOM
        if: steps.preflight.outputs.build == 'true'
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ./.ci-bin/syft scan "${IMAGE}@${DIGEST}" -o "spdx-json=sbom.spdx.json" -q
          test -s sbom.spdx.json
          python3 -c "import json; d=json.load(open('sbom.spdx.json')); print('SBOM packages:', len(d.get('packages', [])))"

      - name: Attest the SBOM
        if: steps.preflight.outputs.build == 'true'
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"

      - name: Sync deploy script
        if: vars.EC2_INSTANCE_ID != '' || vars.EC2_INSTANCE_ID_STAGING != '' || vars.EC2_INSTANCE_ID_PROD != ''
        env:
          INSTANCE_IDS: ${{ vars.EC2_INSTANCE_ID_STAGING }},${{ vars.EC2_INSTANCE_ID_PROD }},${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # The step environment carries the target list. Assign it here so
          # the script stands on its own and shellcheck sees the variable.
          INSTANCE_IDS="${INSTANCE_IDS:?INSTANCE_IDS is required}"
          script_url="https://raw.githubusercontent.com/${{ github.repository }}/${{ env.RELEASE_SHA }}/scripts/deploy.sh"
          expected=$(sha256sum scripts/deploy.sh | awk '{print $1}')
          # Deduplicate, drop empties: staging + prod + legacy fallback.
          ids=$(printf '%s' "$INSTANCE_IDS" | tr ',' '\n' | awk 'NF && !seen[$0]++' | paste -sd' ' -)
          test -n "$ids"
          echo "syncing deploy script to: $ids"
          for INSTANCE_ID in $ids; do
          parameters=$(jq -cn --arg cmd "mkdir -p /opt/devops-task && curl -fsSL -o /opt/devops-task/deploy.sh '$script_url' && echo '$expected  /opt/devops-task/deploy.sh' | sha256sum -c - && chmod +x /opt/devops-task/deploy.sh" '{commands: [$cmd]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "sync deploy script" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          status=Pending
          for _ in $(seq 1 30); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          if [ "$status" != "Success" ]; then
            echo "deploy script sync failed on $INSTANCE_ID with status $status" >&2
            exit 1
          fi
          done

      # deploy.sh records the previous tag and rolls back internally if the
      # new container fails its version-aware health check. Give slow t3
      # instances time to pull: 60 x 5s. Loops over staging + prod.
      - name: Deploy to EC2
        id: deploy
        if: vars.EC2_INSTANCE_ID != '' || vars.EC2_INSTANCE_ID_STAGING != '' || vars.EC2_INSTANCE_ID_PROD != ''
        env:
          INSTANCE_IDS: ${{ vars.EC2_INSTANCE_ID_STAGING }},${{ vars.EC2_INSTANCE_ID_PROD }},${{ vars.EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ env.REGISTRY_IMAGE }}:${{ env.RELEASE_SHA }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # The step environment carries the target list. Assign it here so
          # the script stands on its own and shellcheck sees the variable.
          INSTANCE_IDS="${INSTANCE_IDS:?INSTANCE_IDS is required}"
          ids=$(printf '%s' "$INSTANCE_IDS" | tr ',' '\n' | awk 'NF && !seen[$0]++' | paste -sd' ' -)
          test -n "$ids"
          echo "deploying $IMAGE_URI ($APP_VERSION) to: $ids"
          for INSTANCE_ID in $ids; do
          parameters=$(jq -cn --arg cmd "HEALTH_RETRIES=60 HEALTH_INTERVAL=5 /opt/devops-task/deploy.sh $IMAGE_URI $APP_VERSION" '{commands: [$cmd]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy v$APP_VERSION ($RELEASE_SHA)" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command $INSTANCE_ID: $command_id"
          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
          if [ "$status" != "Success" ]; then
            echo "deploy failed on $INSTANCE_ID with status $status" >&2
            exit 1
          fi
          done

      - name: Smoke test
        id: smoke
        if: vars.EC2_INSTANCE_ID != '' || vars.EC2_INSTANCE_ID_STAGING != '' || vars.EC2_INSTANCE_ID_PROD != ''
        env:
          INSTANCE_IDS: ${{ vars.EC2_INSTANCE_ID_STAGING }},${{ vars.EC2_INSTANCE_ID_PROD }},${{ vars.EC2_INSTANCE_ID }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # The step environment carries the target list. Assign it here so
          # the script stands on its own and shellcheck sees the variable.
          INSTANCE_IDS="${INSTANCE_IDS:?INSTANCE_IDS is required}"
          ids=$(printf '%s' "$INSTANCE_IDS" | tr ',' '\n' | awk 'NF && !seen[$0]++' | paste -sd' ' -)
          test -n "$ids"
          echo "smoke testing $APP_VERSION on: $ids"
          for INSTANCE_ID in $ids; do
          # Retry, don't single-shot: a single curl turns a slow start
          # (reset/empty reply) into a false failure. Version is injected
          # via jq so no shell expansion tricks are needed.
          # shellcheck disable=SC2016
          smoke_tpl='for i in $(seq 1 30); do if out=$(curl -fsS --max-time 5 http://127.0.0.1:8080/health 2>&1); then echo "$out"; echo "$out" | grep -q "\"version\":\"__APP_VERSION__\"" && exit 0; echo "wrong version, retry $i" >&2; else echo "curl retry $i: $out" >&2; docker ps --filter name=devops-task-app --format "{{.Status}}" >&2 || true; fi; sleep 5; done; echo "smoke test failed after retries" >&2; docker logs --tail 100 devops-task-app >&2 || true; exit 1'
          smoke_cmd=${smoke_tpl//__APP_VERSION__/$APP_VERSION}
          parameters=$(jq -cn --arg cmd "$smoke_cmd" '{commands: [$cmd]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "smoke test" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          status=Pending
          for _ in $(seq 1 30); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2 || true
          if [ "$status" != "Success" ]; then
            echo "smoke test failed on $INSTANCE_ID with status $status" >&2
            exit 1
          fi
          done

      # Publishing the release is part of the pipeline, not a manual follow-up.
      # gh release create is idempotent here: an existing release is left alone.
      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest || steps.preflight.outputs.digest }}
          INSTANCE_IDS: ${{ vars.EC2_INSTANCE_ID_STAGING }},${{ vars.EC2_INSTANCE_ID_PROD }},${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # The step environment carries the target list. Assign it here so
          # the script stands on its own and shellcheck sees the variable.
          INSTANCE_IDS="${INSTANCE_IDS:?INSTANCE_IDS is required}"
          tag="v${APP_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists; leaving it unchanged"
            exit 0
          fi
          ids=$(printf '%s' "$INSTANCE_IDS" | tr ',' '\n' | awk 'NF && !seen[$0]++' | paste -sd', ' -)
          gh release create "$tag" --title "$tag" --notes "Container image: \`${REGISTRY_IMAGE}:${tag}\` (+ immutable SHA tag \`${RELEASE_SHA}\`)

          - Platforms: \`linux/amd64\`, \`linux/arm64\`
          - Digest: \`${DIGEST}\`
          - Keyless cosign signature and SPDX SBOM attestation
          - Release workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Deployed over SSM to: ${ids}
          - Version source: \`VERSION\` (${APP_VERSION}); deployments use the immutable commit-SHA tag"

      - name: Release summary
        if: success()
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest || steps.preflight.outputs.digest }}
        run: |
          {
            echo "### Release v${APP_VERSION}"
            echo ""
            echo "- Image: \`${REGISTRY_IMAGE}:v${APP_VERSION}\` and \`:${RELEASE_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Build reused: \`${{ steps.preflight.outputs.build != 'true' }}\`"
            echo "- GitHub Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${APP_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
